<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Charter Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.bundled.js"></script>
<style>

:root{
  --navy:#0A1628;--navy2:#112240;--navy3:#1E3A5F;--navy4:#2A4F7A;
  --gold:#C9A84C;--gold2:#E8C56A;--gold-light:#FDF8EC;
  --blue:#3B82F6;--blue2:#2563EB;--blue-light:#EFF6FF;
  --green:#059669;--green-light:#ECFDF5;
  --amber:#D97706;--amber-light:#FFFBEB;
  --red:#DC2626;--red-light:#FEF2F2;
  --purple:#7C3AED;--purple-light:#F5F3FF;
  --teal:#0F766E;--teal2:#0D9488;--teal-light:#F0FDFA;
  --slate:#F1F5F9;--slate2:#E2E8F0;--slate3:#CBD5E1;--slate4:#94A3B8;
  --text:#0F172A;--text2:#334155;--text3:#64748B;--text4:#94A3B8;
  --border:#E2E8F0;--border2:#CBD5E1;
  --white:#fff;--radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Segoe UI','Inter',system-ui,sans-serif;background:var(--slate);color:var(--text);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── TOP BAR ── */
.topbar{height:56px;background:var(--navy);display:flex;align-items:center;padding:0 24px;gap:14px;flex-shrink:0;border-bottom:1px solid var(--navy3)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:17px;height:17px;stroke:var(--navy);fill:none;stroke-width:2}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-title{font-size:13px;font-weight:400;color:#fff;letter-spacing:-.1px}
.logo-sub{font-size:10px;color:var(--gold);letter-spacing:.3px;text-transform:uppercase;font-weight:400}
.vsep{width:1px;height:22px;background:var(--navy3);margin:0 6px}
.proj-input-wrap{display:flex;align-items:center;gap:8px;background:var(--navy2);border:1px solid var(--navy3);border-radius:8px;padding:5px 12px;min-width:280px}
.proj-input-wrap svg{width:13px;height:13px;stroke:var(--slate4);fill:none;flex-shrink:0}
.proj-input{background:transparent;border:none;color:#fff;font-size:13px;font-weight:400;outline:none;width:240px;font-family:inherit}
.proj-input::placeholder{color:var(--navy4)}
.status-select{background:var(--navy2);border:1px solid var(--navy3);color:var(--slate4);font-size:11px;font-weight:400;border-radius:6px;padding:4px 8px;outline:none;cursor:pointer;font-family:inherit}
.status-select option{background:var(--navy2)}
.topbar-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbtn{padding:6px 13px;border-radius:7px;font-size:11px;font-weight:400;cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;gap:5px;font-family:inherit;letter-spacing:.1px;white-space:nowrap}
.tbtn-ghost{background:rgba(255,255,255,.06);color:#94A3B8;border:1px solid rgba(255,255,255,.08)}.tbtn-ghost:hover{background:rgba(255,255,255,.11);color:#fff}
.tbtn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-weight:400}.tbtn-gold:hover{filter:brightness(1.08)}
.tbtn svg{width:12px;height:12px;flex-shrink:0}

/* ── PROGRESS BAR ── */
.progress-strip{height:3px;background:var(--navy2);flex-shrink:0;position:relative}
.progress-strip-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease;border-radius:0 2px 2px 0}

/* ── LAYOUT ── */
.app{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:230px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sb-header{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sb-header-title{font-size:10px;font-weight:400;color:var(--text4);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.sb-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb-stat{background:var(--slate);border-radius:7px;padding:7px 9px;text-align:center}
.sb-stat-val{font-size:16px;font-weight:400;color:var(--text);line-height:1}
.sb-stat-lbl{font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;font-weight:400}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-nav::-webkit-scrollbar{width:3px}.sb-nav::-webkit-scrollbar-thumb{background:var(--slate2);border-radius:2px}
.sb-group-label{font-size:9px;font-weight:400;color:var(--text4);text-transform:uppercase;letter-spacing:.6px;padding:8px 16px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;margin:1px 8px;border-radius:8px;cursor:pointer;transition:all .12s;font-size:12px;font-weight:400;color:var(--text3);position:relative}
.nav-item:hover{background:var(--slate);color:var(--text)}
.nav-item.active{background:var(--navy);color:#fff;font-weight:400}
.nav-item.active .nav-icon{background:rgba(255,255,255,.15)}
.nav-item.done .nav-icon{background:var(--green-light)}
.nav-item.done .nav-icon svg{stroke:var(--green)}
.nav-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--slate);transition:all .15s}
.nav-icon svg{width:13px;height:13px;fill:none;stroke:var(--text4);stroke-width:1.8;transition:stroke .15s}
.nav-item.active .nav-icon svg{stroke:#fff}
.nav-check{width:14px;height:14px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0}
.nav-check svg{width:8px;height:8px;stroke:#fff;stroke-width:3;fill:none}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);background:var(--slate)}
.sb-footer-pct{font-size:11px;font-weight:400;color:var(--text2);margin-bottom:5px;display:flex;justify-content:space-between}
.sb-track{height:5px;background:var(--slate2);border-radius:3px;overflow:hidden}
.sb-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),#10B981);transition:width .4s}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:6px}.main::-webkit-scrollbar-thumb{background:var(--slate2);border-radius:3px}
.section-wrap{flex:1;padding:28px 32px}

/* ── SECTION HEADER ── */
.sec-hero{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.sec-hero-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(0,0,0,.06)}
.sec-hero-icon svg{width:22px;height:22px;fill:none;stroke-width:1.7}
.sec-hero-body{flex:1}
.sec-hero-num{font-size:10px;font-weight:400;color:var(--text4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.sec-hero-title{font-size:20px;font-weight:400;color:var(--text);letter-spacing:-.3px;line-height:1.2}
.sec-hero-desc{font-size:13px;color:var(--text3);margin-top:4px;line-height:1.5}
.sec-hero-badge{margin-left:auto;display:flex;align-items:center;gap:6px}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:11px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.card-title-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── FORM ── */
.fg{display:grid;gap:14px}
.fg-2{grid-template-columns:1fr 1fr}
.fg-3{grid-template-columns:1fr 1fr 1fr}
.fg-4{grid-template-columns:repeat(4,1fr)}
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-size:11px;font-weight:400;color:var(--text2);letter-spacing:.1px}
.ff input,.ff select,.ff textarea{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--white);font-family:inherit;transition:all .15s;width:100%}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--navy3);box-shadow:0 0 0 3px rgba(10,22,40,.08)}
.ff textarea{resize:vertical;min-height:88px;line-height:1.65}
.ff-hint{font-size:11px;color:var(--text4);font-style:italic}
.ff input::placeholder,.ff textarea::placeholder{color:var(--text4)}

/* ── RICH TABLE ── */
.rt-wrap{overflow-x:auto;border-radius:9px;border:1px solid var(--border);margin-bottom:12px}
.rt{width:100%;border-collapse:collapse;min-width:500px}
.rt thead th{background:var(--navy);color:#CBD5E1;font-size:10px;font-weight:400;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;white-space:nowrap}
.rt thead th:first-child{border-radius:8px 0 0 0}
.rt thead th:last-child{border-radius:0 8px 0 0}
.rt tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.rt tbody tr:last-child{border-bottom:none}
.rt tbody tr:hover{background:#FAFBFF}
.rt td{padding:8px 12px;vertical-align:middle}
.rt td input,.rt td select{border:none;background:transparent;font-size:12px;font-family:inherit;color:var(--text);width:100%;outline:none;padding:3px 0}
.rt td input:focus,.rt td textarea:focus{border-bottom:1.5px solid var(--teal2)}
.rt td textarea{border:none;background:transparent;font-size:12px;font-family:inherit;color:var(--text);width:100%;outline:none;padding:3px 0;resize:none;min-height:28px;overflow:hidden}
.rt-del{background:none;border:none;cursor:pointer;color:var(--text4);font-size:13px;padding:3px 6px;border-radius:5px;transition:all .1s;line-height:1}
.rt-del:hover{background:var(--red-light);color:var(--red)}
.rt-num{width:32px;text-align:center;font-size:11px;color:var(--text4);font-weight:400}
.add-row{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--white);border:1.5px dashed var(--border2);border-radius:8px;font-size:12px;font-weight:400;color:var(--text3);cursor:pointer;transition:all .15s;font-family:inherit}
.add-row:hover{background:var(--teal-light);border-color:var(--teal2);color:var(--teal)}

/* ── BADGES ── */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:400;letter-spacing:.2px}
.pill-green{background:var(--green-light);color:#065F46}
.pill-amber{background:var(--amber-light);color:#92400E}
.pill-red{background:var(--red-light);color:#991B1B}
.pill-blue{background:var(--blue-light);color:#1E40AF}
.pill-grey{background:var(--slate);color:var(--text3)}

/* ── RISK MATRIX ── */
.risk-matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.rm-cell{padding:6px 8px;border-radius:6px;text-align:center;font-size:10px;font-weight:400}
.rm-h{background:#FEE2E2;color:#991B1B}
.rm-m{background:#FEF3C7;color:#92400E}
.rm-l{background:#D1FAE5;color:#065F46}

/* ── SIGN-OFF ── */
.signoff-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.signoff-head{background:var(--navy);padding:12px 20px;display:grid;grid-template-columns:2fr 2fr 1.5fr 1fr 36px;gap:10px}
.signoff-head span{font-size:10px;font-weight:400;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px}
.signoff-row{display:grid;grid-template-columns:2fr 2fr 1.5fr 1fr 36px;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);align-items:center}
.signoff-row:last-child{border-bottom:none}
.signoff-row:nth-child(even){background:var(--slate)}
.signoff-row input{border:none;border-bottom:1px dashed var(--border2);background:transparent;font-family:inherit;font-size:12px;color:var(--text);width:100%;outline:none;padding:2px 0}
.signoff-row input:focus{border-bottom-color:var(--teal2)}
.sig-area{border:1px dashed var(--slate3);border-radius:5px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:10px;font-style:italic}

/* ── BOTTOM NAV ── */
.bottom-bar{border-top:1px solid var(--border);background:var(--white);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.bot-section-info{font-size:12px;color:var(--text3);font-weight:400}
.bot-section-info strong{color:var(--text);font-weight:400}
.bot-btns{display:flex;gap:8px}
.bot-btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:400;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.bot-prev{background:var(--slate);color:var(--text2)}.bot-prev:hover{background:var(--slate2)}
.bot-next{background:var(--navy);color:#fff}.bot-next:hover{background:var(--navy2)}
.bot-finish{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-weight:400}.bot-finish:hover{filter:brightness(1.06)}

/* ── PREVIEW MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,20,.65);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(6px)}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:#F8F9FA;border-radius:4px;width:860px;max-width:100%;display:flex;flex-direction:column;transform:translateY(16px) scale(.975);transition:transform .28s cubic-bezier(.22,.68,0,1.2);overflow:hidden;max-height:92vh;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
.modal-hd{padding:14px 20px;border-bottom:1px solid #DEE2E8;display:flex;align-items:center;justify-content:space-between;background:#fff;flex-shrink:0}
.modal-hd-left{display:flex;align-items:center;gap:10px}
.modal-hd-eyebrow{font-size:10px;font-weight:400;color:#94A3B8;text-transform:uppercase;letter-spacing:.7px}
.modal-hd-title{font-size:14px;font-weight:400;color:#0F172A;margin-top:1px}
.modal-hd-right{display:flex;gap:8px;align-items:center}
.modal-close{background:#F1F5F9;border:none;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;color:#64748B;display:flex;align-items:center;justify-content:center;transition:all .1s}
.modal-close:hover{background:#E2E8F0;color:#0F172A}
.modal-body{padding:0;overflow-y:auto;flex:1;background:#F0F2F5}
.modal-body::-webkit-scrollbar{width:5px}.modal-body::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.mfbtn{padding:8px 18px;border-radius:7px;font-size:12px;font-weight:400;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:5px}
.mfbtn-cancel{background:#F1F5F9;border:1px solid #E2E8F0;color:#475569}.mfbtn-cancel:hover{background:#E2E8F0}
.mfbtn-print{background:var(--navy);color:#fff}.mfbtn-print:hover{background:var(--navy2)}

/* ── CHARTER DOCUMENT — Clean Light Professional ── */
.charter-doc{
  background:#fff;
  margin:20px;
  border-radius:4px;
  box-shadow:0 2px 16px rgba(0,0,0,.10);
  overflow:hidden;
  font-family:'Segoe UI','Calibri',system-ui,sans-serif;
  font-size:13px;
  line-height:1.7;
  color:#1E2535;
}

/* Cover — clean light with blue accent top bar */
.cd-cover{
  background:#fff;
  padding:0;
  position:relative;
  border-bottom:1px solid #E4E8F0;
}
.cd-cover-top-bar{
  height:6px;
  background:linear-gradient(90deg,#1E3A5F,#2E6DB4,#4A9FD4);
}
.cd-cover-accent{display:none}
.cd-cover-stripe{display:none}
.cd-cover-inner{padding:32px 44px 28px;position:relative;z-index:1}
.cd-cover-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.cd-cover-org{display:flex;align-items:center;gap:8px}
.cd-cover-org-mark{width:30px;height:30px;border-radius:6px;background:#1E3A5F;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cd-cover-org-mark svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.cd-cover-org-name{font-size:11px;font-weight:400;color:#94A3B8;letter-spacing:.5px;text-transform:uppercase}
.cd-cover-doctype{font-size:10px;font-weight:400;color:#2E6DB4;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.cd-cover-title{font-size:28px;font-weight:400;color:#1E2535;letter-spacing:-.4px;line-height:1.25;margin-bottom:16px}
.cd-cover-pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cd-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:400;border:1px solid #CBD5E1;color:#64748B;background:#F8FAFC}
.cd-pill-gold{background:#EEF6FF;border-color:#BFDBFE;color:#1D4ED8}
.cd-pill-green{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.cd-pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}

/* Meta strip */
.cd-meta-strip{background:#F8FAFC;border-bottom:1px solid #E4E8F0;padding:0}
.cd-meta-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.cd-meta-cell{padding:14px 20px;border-right:1px solid #E4E8F0}
.cd-meta-cell:last-child{border-right:none}
.cd-meta-label{font-size:9px;font-weight:400;color:#94A3B8;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.cd-meta-label svg{width:10px;height:10px;stroke:#94A3B8;fill:none;stroke-width:2}
.cd-meta-value{font-size:13px;font-weight:400;color:#1E2535}

/* Body */
.cd-body{padding:32px 44px 40px}

/* Section */
.cd-section{margin-bottom:32px}
.cd-section-hd{display:flex;align-items:center;margin-bottom:16px}
.cd-section-num{width:26px;height:26px;border-radius:6px;background:#EEF2FF;color:#1E3A5F;font-size:11px;font-weight:400;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:10px;border:1px solid #C7D7F0}
.cd-section-label{font-size:11px;font-weight:400;color:#1E3A5F;text-transform:uppercase;letter-spacing:.7px}
.cd-section-rule{flex:1;height:1px;background:linear-gradient(90deg,#C7D7F0,transparent);margin-left:12px}

/* Prose block */
.cd-prose{font-size:13px;color:#334155;line-height:1.8;white-space:pre-wrap;margin-bottom:12px}

/* Highlighted box */
.cd-highlight{background:#F8FAFC;border:1px solid #E4E8F0;border-left:3px solid #2E6DB4;border-radius:0 7px 7px 0;padding:13px 18px;margin-bottom:12px}
.cd-highlight-lbl{font-size:9px;font-weight:400;color:#94A3B8;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.cd-highlight-val{font-size:13px;color:#1E2535;line-height:1.7;white-space:pre-wrap}

/* Two-col highlight */
.cd-2up{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

/* Data table */
.cd-tbl-wrap{border:1px solid #E4E8F0;border-radius:8px;overflow:hidden;margin-bottom:14px}
.cd-tbl{width:100%;border-collapse:collapse;font-size:12px}
.cd-tbl thead{background:#F1F5FB}
.cd-tbl th{padding:9px 14px;text-align:left;font-size:9px;font-weight:400;color:#64748B;text-transform:uppercase;letter-spacing:.6px;border-right:1px solid #E4E8F0;white-space:nowrap;border-bottom:2px solid #C7D7F0}
.cd-tbl th:last-child{border-right:none}
.cd-tbl td{padding:9px 14px;border-bottom:1px solid #EEF1F6;color:#334155;font-size:12px;border-right:1px solid #F4F6FA;vertical-align:top}
.cd-tbl td:last-child{border-right:none}
.cd-tbl tbody tr:last-child td{border-bottom:none}
.cd-tbl tbody tr:nth-child(even) td{background:#FAFBFD}
.cd-tbl .row-num{width:28px;text-align:center;color:#94A3B8;font-weight:400;font-size:11px}

/* Risk pills */
.rp{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:400;letter-spacing:.2px}
.rp-h{background:#FEE2E2;color:#991B1B}
.rp-m{background:#FEF3C7;color:#92400E}
.rp-l{background:#D1FAE5;color:#065F46}

/* Budget highlight */
.cd-budget-hero{background:#F1F5FB;border:1px solid #C7D7F0;border-radius:8px;padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:28px}
.cd-budget-total{flex:1}
.cd-budget-lbl{font-size:9px;font-weight:400;color:#64748B;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.cd-budget-val{font-size:24px;font-weight:400;color:#1E3A5F;letter-spacing:-.3px}
.cd-budget-cont{text-align:right}
.cd-budget-cont-lbl{font-size:9px;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:400}
.cd-budget-cont-val{font-size:15px;font-weight:400;color:#2E6DB4}

/* Sign-off */
.cd-sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.cd-sig-box{border:1px solid #E4E8F0;border-radius:8px;overflow:hidden}
.cd-sig-head{background:#F1F5FB;border-bottom:2px solid #C7D7F0;padding:13px 18px}
.cd-sig-name{font-size:13px;font-weight:400;color:#1E2535;margin-bottom:1px}
.cd-sig-role{font-size:11px;color:#64748B}
.cd-sig-body{padding:14px 16px;background:#fff}
.cd-sig-field{margin-bottom:10px}
.cd-sig-field-lbl{font-size:9px;font-weight:400;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.cd-sig-line{height:36px;border-bottom:1.5px solid #CBD5E1;display:flex;align-items:flex-end;padding-bottom:4px}
.cd-sig-date{font-size:11px;color:#64748B;font-weight:400}

/* Footer */
.cd-footer{background:#F1F5FB;border-top:2px solid #C7D7F0;padding:11px 44px;display:flex;align-items:center;justify-content:space-between}
.cd-footer-left{font-size:10px;color:#64748B;font-weight:400;letter-spacing:.2px}
.cd-footer-right{font-size:10px;color:#64748B}
.cd-footer-gold{color:#1E3A5F;font-weight:400}

.cd-risk-h{color:#991B1B;font-weight:400}.cd-risk-m{color:#92400E;font-weight:400}.cd-risk-l{color:#065F46;font-weight:400}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:400;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateY(0)}
.toast-icon{width:18px;height:18px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-icon svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}

@media print{
  body *{visibility:hidden}
  #printContainer,#printContainer *{visibility:visible}
  #printContainer{
    position:fixed;inset:0;z-index:99999;
    background:#fff;overflow:visible;
    display:block!important;
  }
  .charter-doc{box-shadow:none!important;margin:0!important;border-radius:0!important}
  .cd-cover-top-bar,.cd-tbl thead,.cd-budget-hero,.cd-sig-head,.cd-section-num,.cd-footer,.cd-meta-strip,.cd-highlight,.rp{
    -webkit-print-color-adjust:exact;print-color-adjust:exact
  }
  @page{margin:0;size:A4}
}

</style>

<script>
const SECS=[
  {id:'overview',label:'Project Overview',group:'Fundamentals',color:'#3B82F6',bg:'#EFF6FF',
   icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z',
   desc:'Core project details, background, and problem statement'},
  {id:'objectives',label:'Objectives',group:'Fundamentals',color:'#059669',bg:'#ECFDF5',
   icon:'M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9l2 2 4-4',
   desc:'What the project must achieve and how success will be measured'},
  {id:'scope',label:'Scope',group:'Fundamentals',color:'#7C3AED',bg:'#F5F3FF',
   icon:'M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4',
   desc:'Boundaries of the project -- what is and is not included'},
  {id:'stakeholders',label:'Stakeholders',group:'People',color:'#D97706',bg:'#FFFBEB',
   icon:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75M9 7a4 4 0 1 1 0-8 4 4 0 0 1 0 8',
   desc:'Key people, their roles, and level of influence on the project'},
  {id:'timeline',label:'Timeline and Milestones',group:'Planning',color:'#0F766E',bg:'#F0FDFA',
   icon:'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z',
   desc:'Project schedule, key dates, and milestone checkpoints'},
  {id:'budget',label:'Budget',group:'Planning',color:'#DC2626',bg:'#FEF2F2',
   icon:'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
   desc:'Financial resources, breakdown, and contingency planning'},
  {id:'risks',label:'Risks',group:'Planning',color:'#DC2626',bg:'#FEF2F2',
   icon:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
   desc:'Known risks, their likelihood, impact and mitigation strategies'},
  {id:'assumptions',label:'Assumptions and Dependencies',group:'Planning',color:'#7C3AED',bg:'#F5F3FF',
   icon:'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
   desc:'Assumptions the project is based on, and external dependencies'},
  {id:'success',label:'Success Criteria',group:'Outcomes',color:'#059669',bg:'#ECFDF5',
   icon:'M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 0 0 1.946-.806 3.42 3.42 0 0 1 4.438 0 3.42 3.42 0 0 0 1.946.806 3.42 3.42 0 0 1 3.138 3.138',
   desc:'Measurable criteria that define when the project is successful'},
  {id:'signoff',label:'Sign-off and Approval',group:'Outcomes',color:'#0A1628',bg:'#F1F5F9',
   icon:'M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 1 1 3.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z',
   desc:'Formal approval signatures from project sponsors and stakeholders'},
];

var cur=0;
var C={
  projectName:'',status:'Draft',preparedBy:'',preparedDate:'',version:'1.0',department:'',sponsor:'',manager:'',
  background:'',problemStatement:'',projectDescription:'',businessCase:'',
  objectives:[{text:'',measure:'',target:'',owner:''}],
  inScope:'',outScope:'',constraints:'',
  deliverables:[{item:'',description:'',dueDate:'',owner:''}],
  stakeholders:[{name:'',title:'',department:'',responsibility:'',influence:'High',engagement:'Manage Closely'}],
  startDate:'',endDate:'',methodology:'',
  milestones:[{name:'',date:'',owner:'',status:'Not Started',criteria:''}],
  totalBudget:'',currency:'USD',contingency:'',budgetSource:'',
  budgetLines:[{category:'',amount:'',notes:''}],
  risks:[{risk:'',likelihood:'Medium',impact:'Medium',rating:'Medium',mitigation:'',owner:'',status:'Open'}],
  assumptions:[{text:''}],
  dependencies:[{description:'',type:'Internal',owner:'',dueBy:''}],
  successCriteria:[{criterion:'',kpi:'',target:'',reviewDate:''}],
  approvers:[{name:'',title:'',email:'',date:''}],
};

function g(id){return document.getElementById(id);}
function val(id){var e=g(id);return e?e.value:'';}

function syncName(){C.projectName=val('topProjName');updateProgress();}
function syncStatus(){C.status=val('topStatus');updateProgress();}

var ROWS={
  objectives:{text:'',measure:'',target:'',owner:''},
  deliverables:{item:'',description:'',dueDate:'',owner:''},
  stakeholders:{name:'',title:'',department:'',responsibility:'',influence:'High',engagement:'Manage Closely'},
  milestones:{name:'',date:'',owner:'',status:'Not Started',criteria:''},
  budgetLines:{category:'',amount:'',notes:''},
  risks:{risk:'',likelihood:'Medium',impact:'Medium',rating:'Medium',mitigation:'',owner:'',status:'Open'},
  assumptions:{text:''},
  dependencies:{description:'',type:'Internal',owner:'',dueBy:''},
  successCriteria:{criterion:'',kpi:'',target:'',reviewDate:''},
  approvers:{name:'',title:'',email:'',date:''},
};

function addRow(k){save();C[k].push(Object.assign({},ROWS[k]));render();}
function delRow(k,i){save();C[k].splice(i,1);if(!C[k].length)C[k].push(Object.assign({},ROWS[k]));render();}

function isFilled(id){
  switch(id){
    case 'overview':return !!(C.projectName&&C.background);
    case 'objectives':return C.objectives.some(function(o){return o.text;});
    case 'scope':return !!(C.inScope||C.outScope);
    case 'stakeholders':return C.stakeholders.some(function(s){return s.name;});
    case 'timeline':return !!(C.startDate&&C.endDate);
    case 'budget':return !!C.totalBudget;
    case 'risks':return C.risks.some(function(r){return r.risk;});
    case 'assumptions':return C.assumptions.some(function(a){return a.text;})||C.dependencies.some(function(d){return d.description;});
    case 'success':return C.successCriteria.some(function(s){return s.criterion;});
    case 'signoff':return C.approvers.some(function(a){return a.name;});
    default:return false;
  }
}

function updateProgress(){
  var filled=SECS.filter(function(s){return isFilled(s.id);}).length;
  var pct=Math.round(filled/SECS.length*100);
  g('sbPct').textContent=pct+'%';
  g('sbFill').style.width=pct+'%';
  g('progressFill').style.width=pct+'%';
  g('statFilled').textContent=filled;
  g('statTotal').textContent=SECS.length;
  renderSidebar();
}

function renderSidebar(){
  var groups=[];
  SECS.forEach(function(s){if(groups.indexOf(s.group)<0)groups.push(s.group);});
  var html='';
  groups.forEach(function(grp){
    html+='<div class="sb-group-label">'+grp+'</div>';
    SECS.filter(function(s){return s.group===grp;}).forEach(function(s){
      var idx=SECS.indexOf(s);
      var done=isFilled(s.id);
      var active=idx===cur;
      var cls='nav-item'+(active?' active':'')+(done&&!active?' done':'');
      var check=done&&!active?'<div class="nav-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>':'';
      html+='<div class="'+cls+'" onclick="goto('+idx+')">';
      html+='<div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="'+s.icon+'"/></svg></div>';
      html+=s.label+check+'</div>';
    });
  });
  g('sbNav').innerHTML=html;
}

function goto(i){save();cur=i;render();updateProgress();var m=g('sectionWrap');if(m&&m.parentElement)m.parentElement.scrollTop=0;}

function render(){
  var s=SECS[cur];
  var builders={overview:overview,objectives:objectives,scope:scope,stakeholders:stakeholders,
    timeline:timeline,budget:budget,risks:risks,assumptions:assumptions,success:success,signoff:signoff};
  var icon='<div class="sec-hero-icon" style="background:'+s.bg+'"><svg viewBox="0 0 24 24" fill="none" stroke="'+s.color+'" stroke-width="1.7"><path d="'+s.icon+'"/></svg></div>';
  var heroHTML='<div class="sec-hero">'+icon+'<div class="sec-hero-body"><div class="sec-hero-num">Section '+(cur+1)+' of '+SECS.length+' - '+s.group+'</div><div class="sec-hero-title">'+s.label+'</div><div class="sec-hero-desc">'+s.desc+'</div></div></div>';
  g('sectionWrap').innerHTML=heroHTML+builders[s.id]();
  g('botInfo').innerHTML=s.label+' - '+(cur+1)+' of '+SECS.length;
  var prev=cur>0?'<button class="bot-btn bot-prev" onclick="goto('+(cur-1)+')">Previous</button>':'';
  var next=cur<SECS.length-1?'<button class="bot-btn bot-next" onclick="goto('+(cur+1)+')">Save and Continue</button>':'<button class="bot-btn bot-finish" onclick="showPreview()">Preview Charter</button>';
  g('botBtns').innerHTML=prev+next;
}

function ffd(label,id,v,type,hint){
  type=type||'text';hint=hint||'';
  return '<div class="ff"><label>'+label+'</label><input type="'+type+'" id="'+id+'" value="'+String(v||'').replace(/"/g,'&quot;')+'" placeholder="'+hint+'" oninput="autoSave()"></div>';
}
function ffta(label,id,v,hint){
  hint=hint||'';
  return '<div class="ff"><label>'+label+'</label><textarea id="'+id+'" placeholder="'+hint+'" oninput="autoSave()">'+String(v||'')+'</textarea></div>';
}
function ffsel(label,id,v,opts){
  var options=opts.map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>';}).join('');
  return '<div class="ff"><label>'+label+'</label><select id="'+id+'" onchange="autoSave()">'+options+'</select></div>';
}
function rtBtn(key){
  var b=document.createElement("button");
  b.className="add-row";b.textContent="+ Add row";
  b.setAttribute("data-action","addRow");b.setAttribute("data-key",key);
  b.onclick=function(){addRow(this.dataset.key);};
  return b.outerHTML;
}
function inl(v,key,idx,field,ph){
  var esc=String(v||"").replace(/"/g,"&quot;");
  ph=ph||"";
  return "<input value=\""+esc+"\" placeholder=\""+ph+"\" data-key=\""+key+"\" data-idx=\""+idx+"\" data-field=\""+field+"\" oninput=\"C[this.dataset.key][this.dataset.idx][this.dataset.field]=this.value;autoSave()\">";
}
function sel(v,key,idx,field,opts){

function save(){
  var id=SECS[cur].id;
  if(id==='overview'){
    C.projectName=val('ov-name')||C.projectName;C.status=val('ov-status')||C.status;
    C.preparedBy=val('ov-preparedBy');C.preparedDate=val('ov-preparedDate');
    C.version=val('ov-version');C.department=val('ov-dept');
    C.sponsor=val('ov-sponsor');C.manager=val('ov-pm');
    C.background=val('ov-bg');C.problemStatement=val('ov-prob');
    C.projectDescription=val('ov-desc');C.businessCase=val('ov-biz');
    g('topProjName').value=C.projectName;g('topStatus').value=C.status;
  }
  if(id==='scope'){C.inScope=val('sc-in');C.outScope=val('sc-out');C.constraints=val('sc-constraints');}
  if(id==='timeline'){C.startDate=val('tl-start');C.endDate=val('tl-end');C.methodology=val('tl-method');}
  if(id==='budget'){C.totalBudget=val('bgt-total');C.currency=val('bgt-currency');C.contingency=val('bgt-contingency');C.budgetSource=val('bgt-source');}
  updateProgress();
}

      ${c.contingency?`<div class="cd-budget-cont"><div class="cd-budget-cont-lbl">Contingency Reserve</div><div class="cd-budget-cont-val">${c.contingency}</div></div>`:''}
      ${c.budgetSource?`<div class="cd-budget-cont"><div class="cd-budget-cont-lbl">Budget Source</div><div class="cd-budget-cont-val" style="color:#94A3B8">${c.budgetSource}</div></div>`:''}
    </div>
    ${c.budgetLines.some(b=>b.category)?tbl([['Category'],['Amount ('+c.currency+')','150px'],['Notes']],
      c.budgetLines.filter(b=>b.category).map(b=>`<tr>
        <td style="font-weight:400;color:#0F172A">${b.category}</td>
        <td style="font-weight:400">${b.amount||'—'}</td>
        <td style="color:#64748B">${b.notes||'—'}</td>
      </tr>`).join('')):''}
  </div>`:''}

  ${c.risks.some(r=>r.risk)?`
  <div class="cd-section">
    ${secHd(++sn,'Risk Register')}
    ${tbl([['#','32px'],['Risk Description'],['Likelihood','100px'],['Impact','90px'],['Rating','90px'],['Mitigation'],['Owner','90px'],['Status','90px']],
      c.risks.filter(r=>r.risk).map((r,i)=>`<tr>
        <td class="row-num">${i+1}</td>
        <td style="font-weight:400;color:#0F172A">${r.risk}</td>
        <td>${rp(r.likelihood)}</td>
        <td>${rp(r.impact)}</td>
        <td>${rp(r.rating)}</td>
        <td style="color:#475569">${r.mitigation||'—'}</td>
        <td>${r.owner||'—'}</td>
        <td><span style="font-size:11px;font-weight:400;color:${r.status==='Closed'?'#059669':r.status==='Open'?'#DC2626':'#64748B'}">${r.status||'—'}</span></td>
      </tr>`).join(''))}
  </div>`:''}

  ${(c.assumptions.some(a=>a.text)||c.dependencies.some(d=>d.description))?`
  <div class="cd-section">
    ${secHd(++sn,'Assumptions & Dependencies')}
    ${c.assumptions.some(a=>a.text)?`
      <div style="font-size:10px;font-weight:400;color:#94A3B8;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Assumptions</div>
      ${tbl([['#','32px'],['Assumption']],
        c.assumptions.filter(a=>a.text).map((a,i)=>`<tr><td class="row-num">${i+1}</td><td>${a.text}</td></tr>`).join(''))}
    `:''}
    ${c.dependencies.some(d=>d.description)?`
      <div style="font-size:10px;font-weight:400;color:#94A3B8;text-transform:uppercase;letter-spacing:.6px;margin:12px 0 8px">Dependencies</div>
      ${tbl([['#','32px'],['Dependency'],['Type','110px'],['Owner','100px'],['Required By','110px']],
        c.dependencies.filter(d=>d.description).map((d,i)=>`<tr><td class="row-num">${i+1}</td><td style="font-weight:400;color:#0F172A">${d.description}</td><td>${d.type||'—'}</td><td>${d.owner||'—'}</td><td>${fd(d.dueBy)}</td></tr>`).join(''))}
    `:''}
  </div>`:''}

  ${c.successCriteria.some(s=>s.criterion)?`
  <div class="cd-section">
    ${secHd(++sn,'Success Criteria')}
    ${tbl([['#','32px'],['Criterion'],['KPI / Metric','150px'],['Target','130px'],['Review Date','110px']],
      c.successCriteria.filter(s=>s.criterion).map((s,i)=>`<tr>
        <td class="row-num">${i+1}</td>
        <td style="font-weight:400;color:#0F172A">${s.criterion}</td>
        <td>${s.kpi||'—'}</td>
        <td>${s.target||'—'}</td>
        <td>${fd(s.reviewDate)}</td>
      </tr>`).join(''))}
  </div>`:''}

  ${c.approvers.some(a=>a.name)?`
  <div class="cd-section">
    ${secHd(++sn,'Sign-off & Approval')}
    <p style="font-size:12px;color:#64748B;margin-bottom:14px;line-height:1.6">By signing below, the named individuals confirm they have reviewed and approve this Project Charter, and authorise the project to proceed as described.</p>
    <div class="cd-sig-grid">
      ${c.approvers.filter(a=>a.name).map(a=>`
        <div class="cd-sig-box">
          <div class="cd-sig-head">
            <div class="cd-sig-name">${a.name}</div>
            <div class="cd-sig-role">${a.title||'—'}</div>
          </div>
          <div class="cd-sig-body">
            <div class="cd-sig-field">
              <div class="cd-sig-field-lbl">Signature</div>
              <div class="cd-sig-line"></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
              <div>
                <div class="cd-sig-field-lbl">Date signed</div>
                <div class="cd-sig-date">${fd(a.date)}</div>
              </div>
              <div style="font-size:10px;color:#94A3B8;font-style:italic">Approved ✓</div>
            </div>
          </div>
        </div>`).join('')}
    </div>
  </div>`:''}

  </div><!-- end cd-body -->

  <!-- FOOTER -->
  <div class="cd-footer">
    <div class="cd-footer-left">CONFIDENTIAL &nbsp;·&nbsp; ${c.projectName||'Project Charter'} &nbsp;·&nbsp; v${c.version||'1.0'}</div>
    <div class="cd-footer-right">Prepared: ${fd(c.preparedDate)} &nbsp;·&nbsp; Status: <span class="cd-footer-gold">${c.status}</span></div>
  </div>

</div>`;
}


function showPreview(){save();g('modalBody').innerHTML=buildDoc();g('modalBg').classList.add('open');}

function printCharter(){
  save();
  var doc=buildDoc();
  var pc=g('printContainer');
  pc.innerHTML=doc;
  pc.style.display='block';
  setTimeout(function(){
    window.print();
    setTimeout(function(){pc.style.display='none';},500);
  },120);
}
function closeModal(){g('modalBg').classList.remove('open');}
function handleBgClick(e){if(e.target===g('modalBg'))closeModal();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

function takeSnapshot(){
  save();
  var overlay=g('snapOverlay');
  overlay.style.display='flex';
  var pc=g('printContainer');
  pc.innerHTML=buildDoc();
  pc.style.display='block';
  pc.style.position='fixed';
  pc.style.top='-9999px';
  pc.style.width='900px';
  pc.style.background='#fff';
  setTimeout(function(){
    html2canvas(pc,{scale:1.5,useCORS:true,backgroundColor:'#ffffff',logging:false,width:900}).then(function(canvas){
      var url=canvas.toDataURL('image/png');
      g('snapImg').src=url;
      var proj=(C.projectName||'charter').replace(/\s+/g,'-').toLowerCase();
      g('snapTitle').textContent=C.projectName||'Charter Snapshot';
      g('snapDownloadBtn').onclick=function(){
        var a=document.createElement('a');a.href=url;
        a.download=proj+'-charter-snapshot.png';a.click();
        toast('Snapshot downloaded');
      };
      pc.style.display='none';pc.style.position='';pc.style.top='';pc.style.width='';
    }).catch(function(){
      pc.style.display='none';toast('Snapshot failed');overlay.style.display='none';
    });
  },200);
}
function closeSnap(){g('snapOverlay').style.display='none';}


async function downloadPPT(){
  save();
  toast('Generating PowerPoint...');
  try{
    const c=C;
    const fd=s=>{if(!s)return '—';try{return new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch{return s;}};
    const pptx=new PptxGenJS();
    pptx.layout='LAYOUT_WIDE';
    pptx.title=c.projectName||'Project Charter';

    const NAVY='1E3A5F',BLUE='2E6DB4',LB='EEF4FB',
          TXTD='1E2535',TXTS='475569',TXTM='94A3B8',WHITE='FFFFFF',
          BDR='C7D7F0',LH=0.32,SW=13.33,SH=7.5;

    const slide=()=>pptx.addSlide();

    const hdr=(sl,title,sub)=>{
      sl.addShape('rect',{x:0,y:0,w:SW,h:0.08,fill:{color:NAVY}});
      sl.addShape('rect',{x:0,y:0.08,w:SW,h:0.04,fill:{color:BLUE}});
      sl.addText(title,{x:0.5,y:0.18,w:12,h:0.55,fontSize:20,color:TXTD,fontFace:'Segoe UI'});
      if(sub)sl.addText(sub,{x:0.5,y:0.7,w:12,h:0.25,fontSize:10,color:TXTS,fontFace:'Segoe UI',italic:true});
      sl.addShape('line',{x:0.5,y:1.05,w:SW-1,h:0,line:{color:BDR,width:0.5}});
    };

    const foot=(sl,n,tot)=>{
      sl.addShape('line',{x:0,y:SH-0.35,w:SW,h:0,line:{color:BDR,width:0.5}});
      sl.addText((c.projectName||'Project Charter')+' · CONFIDENTIAL',{x:0.5,y:SH-0.3,w:9,h:0.22,fontSize:8,color:TXTM,fontFace:'Segoe UI'});
      sl.addText(n+' / '+tot,{x:SW-1.2,y:SH-0.3,w:0.9,h:0.22,fontSize:8,color:TXTM,align:'right',fontFace:'Segoe UI'});
    };

    const tblOpts=(colW)=>({x:0.5,y:1.18,w:SW-1,colW,border:{pt:0.5,color:BDR},
      fill:{color:WHITE},fontFace:'Segoe UI',fontSize:9,color:TXTS,rowH:LH,
      thead:true,headFill:{color:LB},headColor:NAVY,headFontSize:9,autoPage:false});

    // Count slides
    const secs=['cover','overview',
      c.objectives.some(o=>o.text)?'objectives':null,
      (c.inScope||c.outScope||c.deliverables.some(d=>d.item))?'scope':null,
      c.stakeholders.some(s=>s.name)?'stakeholders':null,
      (c.startDate||c.milestones.some(m=>m.name))?'timeline':null,
      c.totalBudget?'budget':null,
      c.risks.some(r=>r.risk)?'risks':null,
      (c.assumptions.some(a=>a.text)||c.dependencies.some(d=>d.description))?'assumptions':null,
      c.successCriteria.some(s=>s.criterion)?'success':null,
      c.approvers.some(a=>a.name)?'signoff':null,
    ].filter(Boolean);
    const T=secs.length;
    let sn=0;

    // ── COVER
    sn++;
    const cv=slide();
    cv.addShape('rect',{x:0,y:0,w:SW,h:0.1,fill:{color:NAVY}});
    cv.addShape('rect',{x:0,y:0.1,w:SW,h:0.04,fill:{color:BLUE}});
    cv.addShape('rect',{x:0,y:SH-0.08,w:SW,h:0.08,fill:{color:NAVY}});
    cv.addText('PROJECT CHARTER',{x:0.6,y:0.35,w:12,h:0.35,fontSize:10,color:TXTM,fontFace:'Segoe UI',charSpacing:4});
    cv.addText(c.projectName||'Untitled Project',{x:0.6,y:0.7,w:12,h:1.4,fontSize:36,color:TXTD,fontFace:'Segoe UI',wrap:true});
    cv.addShape('line',{x:0.6,y:2.25,w:SW-1.2,h:0,line:{color:BDR,width:0.75}});
    const meta=[['Prepared by',c.preparedBy||'—'],['Department',c.department||'—'],['Sponsor',c.sponsor||'—'],['Manager',c.manager||'—']];
    meta.forEach(([l,v],i)=>{
      const x=0.6+(i*3.2);
      cv.addText(l.toUpperCase(),{x,y:2.35,w:3,h:0.22,fontSize:7,color:TXTM,fontFace:'Segoe UI',charSpacing:0.5});
      cv.addText(v,{x,y:2.57,w:3,h:0.32,fontSize:12,color:TXTD,fontFace:'Segoe UI'});
    });
    const pills=[[`Version ${c.version||'1.0'}`],[fd(c.preparedDate)],[c.status]];
    pills.forEach(([t],i)=>{
      cv.addShape('rect',{x:0.6+(i*2.2),y:3.1,w:2,h:0.32,fill:{color:LB},line:{color:BDR,width:0.5}});
      cv.addText(t,{x:0.6+(i*2.2),y:3.1,w:2,h:0.32,fontSize:9,color:BLUE,align:'center',fontFace:'Segoe UI'});
    });

    // ── OVERVIEW
    sn++;
    const ov=slide();
    hdr(ov,'Project Overview','Background, problem statement and project description');
    let ry=1.22;
    const addBox=(sl,label,val,x,y,w,h,accentCol)=>{
      sl.addShape('rect',{x,y,w:0.04,h,fill:{color:accentCol}});
      sl.addShape('rect',{x:x+0.04,y,w:w-0.04,h,fill:{color:'F8FAFC'},line:{color:BDR,width:0.5}});
      sl.addText(label.toUpperCase(),{x:x+0.18,y:y+0.07,w:w-0.3,h:0.18,fontSize:7,color:TXTM,fontFace:'Segoe UI',charSpacing:0.5});
      sl.addText(val||'—',{x:x+0.18,y:y+0.25,w:w-0.3,h:h-0.32,fontSize:10,color:TXTD,fontFace:'Segoe UI',wrap:true});
    };
    if(c.background){addBox(ov,'Background',c.background,0.5,ry,SW-1,0.9,NAVY);ry+=1.02;}
    if(c.problemStatement){addBox(ov,'Problem Statement',c.problemStatement,0.5,ry,(SW-1.1)/2,0.72,'DC2626');
      if(c.projectDescription)addBox(ov,'Project Description',c.projectDescription,0.5+(SW-1.1)/2+0.1,ry,(SW-1.1)/2,0.72,'2E6DB4');
      ry+=0.84;}
    if(c.businessCase){addBox(ov,'Business Case',c.businessCase,0.5,ry,SW-1,0.72,'059669');}
    foot(ov,sn,T);

    // ── OBJECTIVES
    if(c.objectives.some(o=>o.text)){
      sn++;const os=slide();hdr(os,'Objectives','What the project must achieve and how success will be measured');
      const rows=[['#','Objective','Measurement Method','Target / KPI','Owner']];
      c.objectives.filter(o=>o.text).forEach((o,i)=>rows.push([String(i+1),o.text,o.measure||'—',o.target||'—',o.owner||'—']));
      os.addTable(rows,{...tblOpts([0.4,3.5,2.8,2,1.6])});
      foot(os,sn,T);
    }

    // ── SCOPE
    if(c.inScope||c.outScope||c.deliverables.some(d=>d.item)){
      sn++;const sc=slide();hdr(sc,'Scope','Project boundaries and key deliverables');
      let sy=1.22;
      if(c.inScope||c.outScope){
        const hw=(SW-1.1)/2;
        if(c.inScope){
          sc.addShape('rect',{x:0.5,y:sy,w:0.04,h:0.8,fill:{color:'059669'}});
          sc.addShape('rect',{x:0.54,y:sy,w:hw-0.04,h:0.8,fill:{color:'F8FAFC'},line:{color:BDR,width:0.5}});
          sc.addText('IN SCOPE',{x:0.68,y:sy+0.07,w:hw-0.3,h:0.18,fontSize:7,color:TXTM,fontFace:'Segoe UI'});
          sc.addText(c.inScope,{x:0.68,y:sy+0.25,w:hw-0.3,h:0.48,fontSize:9,color:TXTD,fontFace:'Segoe UI',wrap:true});
        }
        if(c.outScope){
          const ox=0.5+hw+0.1;
          sc.addShape('rect',{x:ox,y:sy,w:0.04,h:0.8,fill:{color:'DC2626'}});
          sc.addShape('rect',{x:ox+0.04,y:sy,w:hw-0.04,h:0.8,fill:{color:'F8FAFC'},line:{color:BDR,width:0.5}});
          sc.addText('OUT OF SCOPE',{x:ox+0.18,y:sy+0.07,w:hw-0.3,h:0.18,fontSize:7,color:TXTM,fontFace:'Segoe UI'});
          sc.addText(c.outScope,{x:ox+0.18,y:sy+0.25,w:hw-0.3,h:0.48,fontSize:9,color:TXTD,fontFace:'Segoe UI',wrap:true});
        }
        sy+=0.92;
      }
      if(c.deliverables.some(d=>d.item)){
        sc.addText('DELIVERABLES',{x:0.5,y:sy,w:5,h:0.22,fontSize:8,color:BLUE,fontFace:'Segoe UI'});sy+=0.24;
        const rows=[['#','Deliverable','Description','Due Date','Owner']];
        c.deliverables.filter(d=>d.item).forEach((d,i)=>rows.push([String(i+1),d.item,d.description||'—',fd(d.dueDate),d.owner||'—']));
        sc.addTable(rows,{...tblOpts([0.4,2.5,3.8,1.5,2.1]),y:sy});
      }
      foot(sc,sn,T);
    }

    // ── STAKEHOLDERS
    if(c.stakeholders.some(s=>s.name)){
      sn++;const sh=slide();hdr(sh,'Stakeholders','Key people and their roles');
      const rows=[['Name','Title','Department','Responsibility','Influence','Engagement']];
      c.stakeholders.filter(s=>s.name).forEach(s=>rows.push([s.name,s.title||'—',s.department||'—',s.responsibility||'—',s.influence||'—',s.engagement||'—']));
      sh.addTable(rows,{...tblOpts([2,1.8,1.6,2.5,1.1,1.8])});
      foot(sh,sn,T);
    }

    // ── TIMELINE
    if(c.startDate||c.milestones.some(m=>m.name)){
      sn++;const tl=slide();hdr(tl,'Timeline & Milestones','Project schedule and key checkpoints');
      const dates=[[fd(c.startDate),'Start Date','1E3A5F'],[fd(c.endDate),'End Date','2E6DB4'],[c.methodology||'—','Methodology','64748B']];
      dates.forEach(([v,l,col],i)=>{
        const x=0.5+(i*4.1);
        tl.addShape('rect',{x,y:1.18,w:3.9,h:0.8,fill:{color:LB},line:{color:BDR,width:0.5}});
        tl.addText(l.toUpperCase(),{x:x+0.15,y:1.25,w:3.6,h:0.2,fontSize:7,color:TXTM,fontFace:'Segoe UI'});
        tl.addText(v,{x:x+0.15,y:1.44,w:3.6,h:0.45,fontSize:15,color:col,fontFace:'Segoe UI'});
      });
      if(c.milestones.some(m=>m.name)){
        const rows=[['#','Milestone','Target Date','Owner','Criteria','Status']];
        c.milestones.filter(m=>m.name).forEach((m,i)=>rows.push([String(i+1),m.name,fd(m.date),m.owner||'—',m.criteria||'—',m.status||'—']));
        tl.addTable(rows,{...tblOpts([0.4,3.8,1.6,1.6,2.2,1.7]),y:2.12});
      }
      foot(tl,sn,T);
    }

    // ── BUDGET
    if(c.totalBudget){
      sn++;const bg=slide();hdr(bg,'Budget','Financial resources and breakdown');
      bg.addShape('rect',{x:0.5,y:1.18,w:SW-1,h:0.9,fill:{color:LB},line:{color:BDR,width:0.5}});
      bg.addText('TOTAL BUDGET',{x:0.7,y:1.25,w:4,h:0.22,fontSize:8,color:TXTM,fontFace:'Segoe UI'});
      bg.addText(`${c.currency} ${c.totalBudget}`,{x:0.7,y:1.46,w:5,h:0.5,fontSize:22,color:NAVY,fontFace:'Segoe UI'});
      bg.addText('CONTINGENCY',{x:6,y:1.25,w:2.5,h:0.22,fontSize:8,color:TXTM,fontFace:'Segoe UI'});
      bg.addText(c.contingency||'—',{x:6,y:1.46,w:2.5,h:0.5,fontSize:14,color:BLUE,fontFace:'Segoe UI'});
      bg.addText('SOURCE',{x:9.5,y:1.25,w:3,h:0.22,fontSize:8,color:TXTM,fontFace:'Segoe UI'});
      bg.addText(c.budgetSource||'—',{x:9.5,y:1.46,w:3,h:0.5,fontSize:12,color:TXTS,fontFace:'Segoe UI'});
      if(c.budgetLines.some(b=>b.category)){
        const rows=[['Category',`Amount (${c.currency})`,'Notes']];
        c.budgetLines.filter(b=>b.category).forEach(b=>rows.push([b.category,b.amount||'—',b.notes||'—']));
        bg.addTable(rows,{...tblOpts([3.8,2.8,5.7]),y:2.22});
      }
      foot(bg,sn,T);
    }

    // ── RISKS
    if(c.risks.some(r=>r.risk)){
      sn++;const rs=slide();hdr(rs,'Risk Register','Known risks, likelihood, impact and mitigation');
      const rows=[['#','Risk','Likelihood','Impact','Rating','Mitigation','Owner','Status']];
      c.risks.filter(r=>r.risk).forEach((r,i)=>rows.push([String(i+1),r.risk,r.likelihood,r.impact,r.rating,r.mitigation||'—',r.owner||'—',r.status||'—']));
      rs.addTable(rows,{...tblOpts([0.35,2.8,1,0.9,0.9,2.5,1.1,1.05])});
      foot(rs,sn,T);
    }

    // ── ASSUMPTIONS
    if(c.assumptions.some(a=>a.text)||c.dependencies.some(d=>d.description)){
      sn++;const as=slide();hdr(as,'Assumptions & Dependencies');
      let ay=1.22;
      if(c.assumptions.some(a=>a.text)){
        as.addText('ASSUMPTIONS',{x:0.5,y:ay,w:5,h:0.22,fontSize:8,color:BLUE,fontFace:'Segoe UI'});ay+=0.25;
        const rows=[['#','Assumption']];
        c.assumptions.filter(a=>a.text).forEach((a,i)=>rows.push([String(i+1),a.text]));
        as.addTable(rows,{...tblOpts([0.4,SW-1.4]),y:ay});
        ay+=0.35+rows.length*LH;
      }
      if(c.dependencies.some(d=>d.description)){
        as.addText('DEPENDENCIES',{x:0.5,y:ay,w:5,h:0.22,fontSize:8,color:BLUE,fontFace:'Segoe UI'});ay+=0.25;
        const rows=[['#','Dependency','Type','Owner','Required By']];
        c.dependencies.filter(d=>d.description).forEach((d,i)=>rows.push([String(i+1),d.description,d.type||'—',d.owner||'—',fd(d.dueBy)]));
        as.addTable(rows,{...tblOpts([0.4,4.5,1.5,1.8,1.8]),y:ay});
      }
      foot(as,sn,T);
    }

    // ── SUCCESS CRITERIA
    if(c.successCriteria.some(s=>s.criterion)){
      sn++;const sc=slide();hdr(sc,'Success Criteria','Measurable definitions of project success');
      const rows=[['#','Criterion','KPI / Metric','Target','Review Date']];
      c.successCriteria.filter(s=>s.criterion).forEach((s,i)=>rows.push([String(i+1),s.criterion,s.kpi||'—',s.target||'—',fd(s.reviewDate)]));
      sc.addTable(rows,{...tblOpts([0.4,3.6,2.8,2,2.5])});
      foot(sc,sn,T);
    }

    // ── SIGN-OFF
    if(c.approvers.some(a=>a.name)){
      sn++;const sg=slide();hdr(sg,'Sign-off & Approval','Formal approval by project sponsors and stakeholders');
      sg.addText('By signing, the named individuals confirm they have reviewed and approve this Project Charter.',
        {x:0.5,y:1.15,w:SW-1,h:0.28,fontSize:9,color:TXTS,fontFace:'Segoe UI',italic:true});
      const appr=c.approvers.filter(a=>a.name);
      const cols=Math.min(appr.length,3);
      const bw=(SW-1-(cols-1)*0.3)/cols;
      appr.forEach((a,i)=>{
        const row=Math.floor(i/3),col=i%3;
        const bx=0.5+col*(bw+0.3),by=1.55+row*2.1;
        sg.addShape('rect',{x:bx,y:by,w:bw,h:0.55,fill:{color:LB},line:{color:BDR,width:0.5}});
        sg.addText(a.name,{x:bx+0.15,y:by+0.1,w:bw-0.3,h:0.22,fontSize:12,color:TXTD,fontFace:'Segoe UI'});
        sg.addText(a.title||'—',{x:bx+0.15,y:by+0.32,w:bw-0.3,h:0.18,fontSize:9,color:TXTS,fontFace:'Segoe UI'});
        sg.addShape('rect',{x:bx,y:by+0.55,w:bw,h:1.1,fill:{color:WHITE},line:{color:BDR,width:0.5}});
        sg.addText('Signature',{x:bx+0.15,y:by+0.62,w:bw-0.3,h:0.18,fontSize:7,color:TXTM,fontFace:'Segoe UI'});
        sg.addShape('line',{x:bx+0.15,y:by+1.38,w:bw-0.3,h:0,line:{color:BDR,width:0.75}});
        sg.addText('Date: '+fd(a.date),{x:bx+0.15,y:by+1.44,w:bw-0.3,h:0.16,fontSize:8,color:TXTS,fontFace:'Segoe UI'});
      });
      foot(sg,sn,T);
    }

    const proj=(c.projectName||'charter').replace(/\s+/g,'-').toLowerCase();
    await pptx.writeFile({fileName:proj+'-charter.pptx'});
    toast('PowerPoint downloaded');
  }catch(e){
    console.error(e);
    toast('PowerPoint failed: '+e.message);
  }
}

/* DOCX */
function downloadDOCX(){

  const fd=s=>{if(!s)return '—';try{return new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch{return s;}};

  // Pure XML-based Word document — no HTML rendering, so colors print correctly
  const tbl=(heads,rows)=>{
    const hcells=heads.map(h=>`<w:tc><w:tcPr><w:tcBorders><w:top w:val="single" w:sz="4" w:color="C7D7F0"/><w:bottom w:val="single" w:sz="4" w:color="C7D7F0"/><w:left w:val="single" w:sz="4" w:color="C7D7F0"/><w:right w:val="single" w:sz="4" w:color="C7D7F0"/></w:tcBorders><w:shd w:val="clear" w:color="auto" w:fill="EEF4FB"/></w:tcPr><w:p><w:pPr><w:jc w:val="left"/></w:pPr><w:r><w:rPr><w:color w:val="1E3A5F"/><w:sz w:val="16"/><w:szCs w:val="16"/></w:rPr><w:t>${esc(h)}</w:t></w:r></w:p></w:tc>`).join('');
    const bodyrows=rows.map(cells=>`<w:tr>${cells.map(cell=>`<w:tc><w:tcPr><w:tcBorders><w:top w:val="single" w:sz="4" w:color="C7D7F0"/><w:bottom w:val="single" w:sz="4" w:color="C7D7F0"/><w:left w:val="single" w:sz="4" w:color="C7D7F0"/><w:right w:val="single" w:sz="4" w:color="C7D7F0"/></w:tcBorders></w:tcPr><w:p><w:r><w:rPr><w:color w:val="475569"/><w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr><w:t xml:space="preserve">${esc(cell)}</w:t></w:r></w:p></w:tc>`).join('')}</w:tr>`).join('');
    return `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders><w:insideH w:val="single" w:sz="4" w:color="C7D7F0"/><w:insideV w:val="single" w:sz="4" w:color="C7D7F0"/></w:tblBorders></w:tblPr><w:tr>${hcells}</w:tr>${bodyrows}</w:tbl><w:p/>`;
  };

  const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const secTitle=(t,n)=>`<w:p><w:pPr><w:pStyle w:val="Heading2"/><w:spacing w:before="280" w:after="100"/></w:pPr>
    <w:r><w:rPr><w:color w:val="1E3A5F"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t>${n}  ${esc(t)}</w:t></w:r></w:p>`;

  const para=(text,color='475569',sz=20)=>`<w:p><w:r><w:rPr><w:color w:val="${color}"/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p>`;

  const labelVal=(label,val)=>`<w:p><w:pPr><w:spacing w:before="60" w:after="20"/></w:pPr>
    <w:r><w:rPr><w:color w:val="94A3B8"/><w:sz w:val="14"/><w:szCs w:val="14"/></w:rPr><w:t xml:space="preserve">${esc(label.toUpperCase())}  </w:t></w:r>
    <w:r><w:rPr><w:color w:val="1E2535"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t>${esc(val||'—')}</w:t></w:r></w:p>`;

  let sn=0;
  const body=[];

  // Title
  body.push(`<w:p><w:pPr><w:pStyle w:val="Title"/><w:spacing w:before="0" w:after="120"/></w:pPr>
    <w:r><w:rPr><w:color w:val="1E2535"/><w:sz w:val="52"/><w:szCs w:val="52"/></w:rPr><w:t>${esc(c.projectName||'Project Charter')}</w:t></w:r></w:p>`);
  body.push(`<w:p><w:r><w:rPr><w:color w:val="2E6DB4"/><w:sz w:val="16"/><w:szCs w:val="16"/></w:rPr><w:t>PROJECT CHARTER  ·  ${esc(`Version ${c.version||'1.0'}`)}  ·  ${esc(fd(c.preparedDate))}  ·  ${esc(c.status)}</w:t></w:r></w:p><w:p/>`);

  }

  // Budget

    if(c.budgetLines.some(b=>b.category)){

        c.budgetLines.filter(b=>b.category).map(b=>[b.category,b.amount||'—',b.notes||'—'])));
    }
  }

  // Risks
  if(c.risks.some(r=>r.risk)){
    sn++;body.push(secTitle('Risk Register',sn+'.'));
    body.push(tbl(['#','Risk','Likelihood','Impact','Rating','Mitigation','Owner','Status'],
      c.risks.filter(r=>r.risk).map((r,i)=>[String(i+1),r.risk,r.likelihood,r.impact,r.rating,r.mitigation||'—',r.owner||'—',r.status||'—'])));
  }

  // Assumptions
  if(c.assumptions.some(a=>a.text)||c.dependencies.some(d=>d.description)){
    sn++;body.push(secTitle('Assumptions & Dependencies',sn+'.'));
    if(c.assumptions.some(a=>a.text)){
